<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هل تكونين حبيبتي في الفالنتاين؟ 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6b9d, #c44569, #ff9ff3, #feca57);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.15);
            padding: 50px 30px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
            max-width: 500px;
            width: 90%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(1deg); }
            66% { transform: translateY(-5px) rotate(-1deg); }
        }

        .heart {
            font-size: 100px;
            margin-bottom: 25px;
            display: block;
            animation: heartbeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.8));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            14% { transform: scale(1.3) rotate(0deg); }
            28% { transform: scale(1) rotate(2deg); }
            42% { transform: scale(1.3) rotate(0deg); }
            70% { transform: scale(1) rotate(0deg); }
        }

        h1 {
            color: white;
            font-size: clamp(24px, 5vw, 32px);
            margin-bottom: 35px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 35px;
            font-size: clamp(16px, 4vw, 20px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .yes-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8e8e, #ff6b9d);
            color: white;
            box-shadow: 0 15px 30px rgba(255,107,157,0.4);
        }

        .yes-btn:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 25px 50px rgba(255,107,157,0.6);
        }

        .no-btn {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe, #fd79a8);
            color: white;
            box-shadow: 0 15px 30px rgba(108,92,231,0.4);
        }

        .no-btn.moving {
            position: fixed !important;
            z-index: 1000;
            transform: scale(1.1) !important;
            transition: all 0.3s ease-out;
        }

        .yes-screen {
            display: none;
            animation: celebrate 1s ease-out;
        }

        @keyframes celebrate {
            0% { transform: scale(0.3) rotate(180deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); }
        }

        .celebration-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
        }

        .heart-particle {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: floatAway 3s ease-out forwards;
        }

        @keyframes floatAway {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50vw) scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 250px; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="heart">💖</div>
        <h1>هل تكونين حبيبتي في الفالنتاين؟</h1>
        <div class="buttons">
            <button class="btn yes-btn" id="yesBtn">نعم 💕</button>
            <button class="btn no-btn" id="noBtn">لا</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const container = document.getElementById('container');

        const noTexts = [
            'متأكدة؟ 😢',
            'بس أنا بحبك 💔',
            'الفالنتاين من غيرك ممل 😭',
            'فكّري تاني يا قلبي 🤔',
            'أنتِ الوحيدة في قلبي 💖',
            '😍 بس قولي نعم',
            '💝 أرجوكِ',
            'ما أقدرش أعيش من غيرك ❤️'
        ];

        let noClickCount = 0;

        noBtn.addEventListener('click', function(e) {
            noClickCount++;
            
            if (noClickCount < noTexts.length) {
                noBtn.textContent = noTexts[noClickCount];
                noBtn.classList.add('moving');
                
                // حركة عشوائية للزر "لا"
                const maxX = window.innerWidth - noBtn.offsetWidth - 20;
                const maxY = window.innerHeight - noBtn.offsetHeight - 20;
                const randomX = Math.random() * maxX;
                const randomY = Math.random() * maxY;
                
                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
                
                // تكبير زر "نعم"
                yesBtn.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    yesBtn.style.transform = 'scale(1)';
                }, 300);
            }
        });

        yesBtn.addEventListener('click', function() {
            container.innerHTML = `
                <div class="yes-screen">
                    <div class="heart" style="font-size: 150px; margin-bottom: 20px;">💝</div>
                    <h1 style="font-size: 3em; color: #ff6b9d; margin-bottom: 20px;">يلااااااااااا 🎉🎉</h1>
                    <p style="color: white; font-size: 24px; margin: 30px 0; font-weight: bold;">أحبك أكتر من الكون كله! 🥰🥰</p>
                    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                        <span class="heart" style="font-size: 60px;">💖</span>
                        <span class="heart" style="font-size: 60px;">💕</span>
                        <span class="heart" style="font-size: 60px;">💝</span>
                        <span class="heart" style="font-size: 60px;">🌸</span>
                    </div>
                </div>
            `;
            createHeartExplosion();
        });

        function createHeartExplosion() {
            const hearts = ['💖', '💕', '💝', '🌸', '✨', '🌟', '💫'];
            
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = Math.random() * 100 + 'vh';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    heart.style.animationDelay = Math.random() * 0.5 + 's';
                    
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 5000);
                }, i * 50);
            }
        }

        // تأثير كونفيتي مستمر في الخلفية
        function createBackgroundConfetti() {
            setInterval(() => {
                if (Math.random() < 0.3) {
                    const confetti = document.createElement('div');
                    confetti.innerHTML = ['✨', '🌟'][Math.floor(Math.random() * 2)];
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-20px';
                    confetti.style.fontSize = '20px';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '-1';
                    confetti.style.animation = 'fall 4s linear forwards';
                    
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }
            }, 800);
        }

        // إضافة الـ CSS للكونفيتي
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // تشغيل الكونفيتي في الخلفية
        createBackgroundConfetti();
    </script>
</body>
</html>
