<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minion Valentine - كوني فالنتاين بتي؟ 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .minion-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .minion {
            width: 250px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .minion:hover {
            transform: scale(1.05);
        }

        /* قلب يطلع من إيد الـMinion اليمين */
        .minion-heart {
            position: absolute;
            bottom: 15%;
            right: 12%;
            width: 35px;
            height: 35px;
            background: #ff4757;
            clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
            transform: scale(0);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: heartEmerge 2s ease-out forwards;
        }

        /* الأنيميشن الرئيسي للقلب */
        @keyframes heartEmerge {
            0% {
                transform: scale(0) translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                transform: scale(1.4) translateY(-15px) rotate(15deg);
                opacity: 1;
            }
            30% {
                transform: scale(1.1) translateY(-40px) rotate(-10deg);
            }
            70% {
                transform: scale(1) translateY(-100px) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(-200px) rotate(720deg);
                opacity: 0;
            }
        }

        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            direction: rtl;
        }

        .heart-big {
            font-size: 3em;
            color: #ff4081;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            direction: rtl;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff6b9d, #e91e63);
            color: white;
        }

        #yesBtn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.4);
        }

        #noBtn {
            background: linear-gradient(45deg, #757575, #424242);
            color: white;
        }

        #noBtn:hover {
            transform: translate(-20px, -10px);
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .heart-float {
            position: absolute;
            font-size: 24px;
            color: #ff4081;
            animation: heartFloat 3s ease-out forwards;
            pointer-events: none;
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        .success {
            background: linear-gradient(45deg, #4caf50, #8bc34a) !important;
            animation: bounce 0.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container { padding: 40px 20px; margin: 20px; }
            .minion { width: 200px; }
            h1 { font-size: 2em; }
            button { padding: 15px 30px; font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container">
        <div class="minion-container">
            <div class="minion-heart" id="minionHeart"></div>
            <img src="minion.png" alt="Minion Valentine" class="minion" id="minion">
        </div>
        
        <div id="proposal">
            <div class="heart-big">💖</div>
            <h1>بدك تكوني فالنتاين بتي؟</h1>
            <div class="buttons">
                <button id="yesBtn">نعم! 💕</button>
                <button id="noBtn">لا 😏</button>
            </div>
        </div>
        
        <div id="success" class="hidden">
            <div class="heart-big">💝</div>
            <h1>يلاااا! 😍 أحبك!</h1>
            <p style="font-size: 1.2em; color: #4caf50; margin-top: 20px;">كنت عارفة ما تقدري تقاومي! 💋</p>
        </div>
    </div>

    <script>
        const minion = document.getElementById('minion');
        const minionHeart = document.getElementById('minionHeart');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposal = document.getElementById('proposal');
        const success = document.getElementById('success');
        const heartsContainer = document.getElementById('hearts');

        let heartInterval;

        // أنيميشن القلب من إيد الـMinion
        function triggerMinionHeart() {
            minionHeart.style.display = 'block';
            minionHeart.style.opacity = '1';
            minionHeart.style.transform = 'scale(0)';
            
            // Reset وتشغيل الأنيميشن
            minionHeart.style.animation = 'none';
            requestAnimationFrame(() => {
                minionHeart.style.animation = 'heartEmerge 2s ease-out forwards';
            });
            
            setTimeout(() => {
                minionHeart.style.display = 'none';
                minionHeart.style.opacity = '0';
            }, 2000);
        }

        // تفاعل مع الـMinion والأزرار
        minion.addEventListener('mouseenter', triggerMinionHeart);
        minion.addEventListener('click', triggerMinionHeart);
        noBtn.addEventListener('mouseenter', triggerMinionHeart);
        noBtn.addEventListener('click', triggerMinionHeart);

        // زر No بيهرب من الماوس
        noBtn.addEventListener('mouseenter', function(e) {
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * 100;
            const y = (e.clientY - rect.top) / rect.height * 100;
            const moveX = (x > 50 ? -30 : 30);
            const moveY = (y > 50 ? -20 : 20);
            this.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        noBtn.addEventListener('mouseleave', function() {
            this.style.transform = 'translate(0, 0)';
        });

        // دعم الموبايل
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerMinionHeart();
        });

        minion.addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerMinionHeart();
        });

        // زر Yes - الاحتفال!
        yesBtn.addEventListener('click', function() {
            proposal.classList.add('hidden');
            success.classList.remove('hidden');
            this.classList.add('success');
            
            // عاصفة قلوب
            heartInterval = setInterval(() => {
                for (let i = 0; i < 8; i++) {
                    createHeart();
                }
            }, 150);
            
            setTimeout(() => clearInterval(heartInterval), 6000);
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = ['💖', '💕', '💗', '💝', '💘'][Math.floor(Math.random() * 5)];
            heart.className = 'heart-float';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 50 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        // قلوب تلقائية كل شوي للتأثير الحلو
        setInterval(() => {
            if (!success.classList.contains('hidden')) {
                createHeart();
            }
        }, 1000);
    </script>
</body>
</html>
