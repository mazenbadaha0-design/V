<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine? - Minion Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .minion {
            width: 250px;
            height: auto;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .minion:hover {
            transform: scale(1.05);
        }

        /* نقطة خروج القلب من عيون الـMinion */
        .minion::before {
            content: '';
            position: absolute;
            top: 35%; /* تقريباً موقع العيون */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 1px;
            z-index: 5;
        }

        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .heart-big {
            font-size: 3em;
            color: #ff4081;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff6b9d, #e91e63);
            color: white;
        }

        #yesBtn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.4);
        }

        #noBtn {
            background: linear-gradient(45deg, #757575, #424242);
            color: white;
        }

        #noBtn:hover {
            transform: translate(20px, -10px);
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .heart-float {
            position: absolute;
            font-size: 24px;
            color: #ff4081;
            animation: heartPop 3s ease-out forwards;
            pointer-events: none;
        }

        /* الأنيميشن الجديد: يطلع من الـMinion ويطير */
        @keyframes heartPop {
            0% {
                opacity: 0;
                transform: scale(0) translateY(0) rotate(0deg);
            }
            10% {
                opacity: 1;
                transform: scale(1.2) translateY(-20px) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-100vh) rotate(720deg);
            }
        }

        .success {
            background: linear-gradient(45deg, #4caf50, #8bc34a) !important;
            animation: bounce 0.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container { padding: 40px 20px; margin: 20px; }
            .minion { width: 200px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container">
        <img src="minion.png" alt="Minion Valentine" class="minion" id="minion">
        <div id="proposal">
            <div class="heart-big">💖</div>
            <h1>Will you be my Valentine?</h1>
            <div class="buttons">
                <button id="yesBtn">YES! 💕</button>
                <button id="noBtn">No 😏</button>
            </div>
        </div>
        <div id="success" class="hidden">
            <div class="heart-big">💝</div>
            <h1>YAYYY! 😍</h1>
            <p style="font-size: 1.2em; color: #4caf50; margin-top: 20px;">I knew you couldn't resist! 💋</p>
        </div>
    </div>

    <script>
        const minion = document.getElementById('minion');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposal = document.getElementById('proposal');
        const success = document.getElementById('success');
        const heartsContainer = document.getElementById('hearts');

        let heartInterval;

        // أنيميشن قلب من الـMinion كل hover على No أو Minion
        function triggerMinionHeart() {
            createMinionHeart();
        }

        minion.addEventListener('mouseenter', triggerMinionHeart);
        minion.addEventListener('click', triggerMinionHeart);
        noBtn.addEventListener('mouseenter', triggerMinionHeart);

        // No button dodging
        noBtn.addEventListener('mouseenter', function(e) {
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * 100;
            const y = (e.clientY - rect.top) / rect.height * 100;
            const moveX = (x > 50 ? -30 : 30);
            const moveY = (y > 50 ? -20 : 20);
            this.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        noBtn.addEventListener('mouseleave', function() {
            this.style.transform = 'translate(0, 0)';
        });

        // Mobile support
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerMinionHeart();
            // Dodging logic for touch...
        });

        // Yes button
        yesBtn.addEventListener('click', function() {
            proposal.classList.add('hidden');
            success.classList.remove('hidden');
            this.classList.add('success');
            heartInterval = setInterval(() => {
                for (let i = 0; i < 5; i++) createHeart();
            }, 200);
            setTimeout(() => clearInterval(heartInterval), 5000);
        });

        function createMinionHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.className = 'heart-float';
            heart.style.left = '50%'; // من وسط الشاشة (عيون Minion)
            heart.style.top = '40%';  // ارتفاع الـMinion
            heart.style.fontSize = '30px';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = ['💖', '💕', '💗', '💝'][Math.floor(Math.random() * 4)];
            heart.className = 'heart-float';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 50 + '%';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
